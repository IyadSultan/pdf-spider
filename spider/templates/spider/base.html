{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper spider{% endblock %}</title>
  <link rel="icon" href="{% static 'spider/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body{background:#eef0f6;color:#14161f;font-family:"IBM Plex Sans",system-ui,sans-serif}
    h1{font-family:"Newsreader",Georgia,serif;font-weight:600}
    .panel{max-width:440px;margin:8vh auto;background:#fff;border:1px solid #d3d7e4;border-radius:12px;padding:28px 24px}
    .btn-accent{background:#0b6f8a;color:#fff;border:0;font-weight:600}
    .btn-accent:hover{background:#09596e;color:#fff}
    a{color:#3b47c9}
  </style>
</head>
<body>
  <main class="panel">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
